# .github/workflows/ci.yml

name: CI

on:
  # Run on push or PRs to main branch. `publish.yml` starts from this workflow's own completed run
  # on `master` (`workflow_run`), so a push runs these checks once and publish waits for them.
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  ci:
    runs-on: ubuntu-24.04
    permissions:
      contents: read # Allows reading of the repository's contents.

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check formatting
        run: deno fmt --check

      - name: Lint
        run: deno lint

      - name: Check for circular-import hazards
        run: deno run --no-config --min-dep-age=0 -A jsr:@zanix/cli check-cycles

      - name: Check for duplicate '@zanix/*' dependencies
        run: deno run --no-config --min-dep-age=0 -A jsr:@zanix/cli check-duplicates

      - name: Run tests
        # `*-live.test.ts` files are excluded: they hit a real, third-party network service outside
        # this repo's control (see graphql-introspect-live.test.ts's own doc), so its uptime must
        # never gate `deno publish`. The `test-live` job below runs them without gating.
        run: deno test --allow-all --ignore='**/*-live.test.ts'

  # `*-live.test.ts` files hit a real, third-party network service outside this repo's control (see
  # graphql-introspect-live.test.ts's own doc), so they run in their own job and never gate
  # anything: `continue-on-error` keeps this job's failure from failing the run, so the `ci` job
  # above alone decides whether the run passes and `publish.yml` starts. A failure still shows up as
  # a red job to look at.
  test-live:
    runs-on: ubuntu-24.04
    continue-on-error: true
    permissions:
      contents: read # Allows reading of the repository's contents.

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run live tests
        run: deno test --allow-all '**/*-live.test.ts'
